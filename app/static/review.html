<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Очередь проверки откликов</title>
  <link rel="stylesheet" href="/assets/css/review.css">
</head>
<body>
  <header>
    <div><div id="review-eyebrow" class="eyebrow">Human checkpoint</div><h1 id="review-title">Review queue</h1></div>
    <div class="auth">
      <label><span id="api-key-label" class="eyebrow">API key</span><br><input id="api-key" type="password" autocomplete="off" aria-label="API key"></label>
      <button id="refresh" type="button">Refresh</button>
      <div id="language-selector" class="language-selector">
        <button id="language-toggle" class="language-toggle" type="button"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="language-menu"
                title="Текущий язык: Русский" aria-label="Текущий язык: Русский">
          <svg class="language-flag" viewBox="0 0 3 2" aria-hidden="true" focusable="false">
            <rect width="3" height="2" fill="#fff"></rect>
            <rect y="0.6667" width="3" height="0.6667" fill="#0039a6"></rect>
            <rect y="1.3333" width="3" height="0.6667" fill="#d52b1e"></rect>
          </svg>
          <span class="language-name">Русский</span>
          <span class="language-chevron" aria-hidden="true">▾</span>
        </button>
        <div id="language-menu" class="language-menu" role="listbox" aria-label="Язык интерфейса" hidden></div>
      </div>
    </div>
  </header>
  <main class="review-shell">
    <nav class="sidebar" aria-label="Разделы личного кабинета">
      <a id="nav-vacancies" href="/dashboard?panel=vacancies">Все вакансии</a>
      <a id="nav-search" href="/dashboard?panel=search">Поиск</a>
      <a id="nav-materials" class="active" href="/review">Материалы и решения</a>
      <a id="nav-blacklist" href="/dashboard?panel=blacklist">Чёрный список</a>
      <a id="nav-resume" href="/dashboard?panel=resume">Резюме</a>
      <a id="nav-sessions" href="/dashboard?panel=sessions">Сессии сайтов</a>
      <a id="nav-model" href="/dashboard?panel=model">Модель</a>
      <a id="nav-access" href="/dashboard?panel=access">Профиль и доступ</a>
    </nav>
    <div class="review-content">
      <div id="status" role="status" aria-live="polite"></div>
      <section id="queue" aria-label="Applications awaiting review"></section>
    </div>
  </main>
  <script src="/assets/js/review.js"></script>
</body>
</html>
