name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff format --check app adapters tests migrations scripts
      - run: python -m ruff check app adapters tests migrations scripts
      - run: python -m mypy app adapters scripts
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.txt
      - run: docker build -t job-searching-assistant:test .
